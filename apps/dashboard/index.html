    <script nonce="__STREAMOPS_CSP_NONCE__">
      (() => {
        const googleConsentKey = "yoro.google.consent.v1";
        const legacyAdConsentKey = "yoro.ads.consent";
        const googleConsentEvent = "yoro:google-consent";
        const adsenseScriptId = "yoro-google-adsense";
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("consent", "default", {
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
          analytics_storage: "denied",
          wait_for_update: 500
        });
        window.__yoroGoogleConsentInitialized = true;
        window.gtag("set", "ads_data_redaction", true);
        /* Auto ads는 문서형 안내와 실데이터 목록처럼 게시자 콘텐츠가 화면의
           중심인 경로에서만 허용합니다. 검색·로그인·설정·법적 고지·빈 상태·
           준비 중·계산기 화면은 행동 목적 화면이므로 여기에 추가하지 않습니다. */
        const publisherContentExactPaths = new Set([
          "/bot/getting-started",
          "/bot/commands",
          "/bot/game-files",
          "/palworld/pals",
          "/palworld/items",
          "/palworld/technology",
          "/palworld/skills"
        ]);
        const publisherContentPathPrefixes = [
          "/palworld/pals/",
          "/palworld/items/",
          "/palworld/skills/"
        ];
        const isAdEligiblePath = () => {
          if (document.querySelector('meta[name="robots"][content*="noindex"]')) return false;
          const localizedPath = window.location.pathname.replace(/^\/(?:ko|ja|en)(?=\/|$)/, "") || "/";
          const pathname = localizedPath.replace(/\/+$/, "") || "/";
          return publisherContentExactPaths.has(pathname)
            || publisherContentPathPrefixes.some((prefix) => pathname.startsWith(prefix));
        };
        const injectAdsense = () => {
          if (document.getElementById(adsenseScriptId)) return;
          const script = document.createElement("script");
          script.id = adsenseScriptId;
          script.async = true;
          script.crossOrigin = "anonymous";
          script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7880271953912430";
          document.head.append(script);
        };
        /* 지연 로드(2026-08-18 결정): 동의가 있어도 초기 렌더 경로에서 201KB 광고
           스크립트를 받지 않습니다. 브라우저 유휴 + 첫 상호작용(스크롤·포인터·키)
           중 먼저 오는 쪽에서 주입하고, 상호작용이 없으면 8초 후 폴백 주입합니다. */
        let adsenseDeferArmed = false;
        const scheduleAdsense = () => {
          if (adsenseDeferArmed || document.getElementById(adsenseScriptId)) return;
          adsenseDeferArmed = true;
          let done = false;
          const fire = () => {
            if (done) return;
            done = true;
            ["scroll", "pointerdown", "keydown", "touchstart"].forEach((type) =>
              window.removeEventListener(type, fire));
            const idle = window.requestIdleCallback ?? ((fn) => window.setTimeout(fn, 200));
            idle(() => injectAdsense());
          };
          ["scroll", "pointerdown", "keydown", "touchstart"].forEach((type) =>
            window.addEventListener(type, fire, { once: false, passive: true }));
          window.setTimeout(fire, 8000);
        };
        const loadAdsense = () => {
          if (!isAdEligiblePath()) {
            /* SPA에서 이미 Auto ads가 실행된 문서가 기능성 화면으로 이동하면
               script 태그만 제거해도 내부 실행이 남습니다. 새 문서로 전환해
               광고 실행 컨텍스트 자체를 확실히 종료합니다. */
            if (document.getElementById(adsenseScriptId)) window.location.reload();
            return;
          }
          try {
            if (window.localStorage.getItem(googleConsentKey) !== "granted") return;
          } catch {
            return;
          }
          scheduleAdsense();
        };
        const consentState = (choice) => ({
          ad_storage: choice,
          ad_user_data: choice,
          ad_personalization: choice,
          analytics_storage: choice
        });
        const applyStoredGoogleConsent = () => {
          try {
            const choice = window.localStorage.getItem(googleConsentKey);
            if (choice !== "granted" && choice !== "denied") return;
            window.gtag("consent", "update", consentState(choice));
            if (choice === "granted") loadAdsense();
          } catch {
            // 저장소 접근이 차단된 환경에서는 기본 거부 상태를 유지합니다.
          }
        };

        applyStoredGoogleConsent();
        window.addEventListener(googleConsentEvent, (event) => {
          if (!(event instanceof CustomEvent)) return;
          if (event.detail?.choice === "granted") loadAdsense();
        });
        window.addEventListener("yoro:ads-consent", (event) => {
          if (!(event instanceof CustomEvent)) return;
          const granted = event.detail?.granted === true;
          window.gtag("consent", "update", {
            ad_storage: granted ? "granted" : "denied",
            ad_user_data: granted ? "granted" : "denied",
            ad_personalization: granted ? "granted" : "denied"
          });
          try {
            window.localStorage.setItem(legacyAdConsentKey, granted ? "granted" : "denied");
          } catch {
            // 저장소 접근이 차단되어도 현재 문서의 동의 상태는 갱신합니다.
          }
          if (granted) loadAdsense();
        });
        window.addEventListener("publicroutechange", loadAdsense);
        window.addEventListener("palworldroutechange", loadAdsense);
        window.addEventListener("popstate", loadAdsense);
      })();
    </script>

    <script nonce="__STREAMOPS_CSP_NONCE__">
      /* 테마를 첫 페인트 전에 확정합니다. 이게 없으면 라우트 청크가 도착할 때까지
         문서에 data-public-theme 이 없어서 SEO 본문·로딩 화면·동의 바가 전부
         기본값으로 그려졌다가 튑니다(usePublicTheme / useHomeTheme 은 effect 에서만
         속성을 붙입니다).
         기본값 규칙은 훅과 정확히 같습니다: 홈 계열(/ · /lol · /follow)은 다크,
         그 밖의 공개 화면은 라이트. localStorage 에 쓰지 않습니다 — 저장값 없음을
         "없음"으로 유지해야 useHomeTheme 의 다크 기본이 살아 있습니다. */
      (() => {
        try {
          const path = window.location.pathname;
          if (/^\/dashboard(?:\/|$)/.test(path)) return;
          const stored = window.localStorage.getItem("loltrace.theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.dataset.publicTheme = stored;
            return;
          }
          const unprefixed = path.replace(/^\/(?:ko|ja|en)(?=\/|$)/, "") || "/";
          const normalized = unprefixed.replace(/\/+$/, "") || "/";
          /* 홈 계열: 루트 · lol 홈 · 팔로우 — 문자열 리터럴 대신 정규식인 이유:
             production-metadata 검사가 index.html 안의 따옴표 친 비콘텐츠 경로
             리터럴을 AdSense 게이팅 목록으로 오인하지 않게. */
          const homeFamily = /^\/(?:lol|follow)?$/.test(normalized);
          document.documentElement.dataset.publicTheme = homeFamily ? "dark" : "light";
        } catch {
          /* localStorage 접근 실패는 화면을 막지 않습니다 — 훅이 뒤에서 정합니다. */
        }
      })();
    </script>
