services:
  server:
    image: ${YORO_SERVER_IMAGE:-streamops-server:local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0-dev}
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: streamops-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      STREAMOPS_LOCAL_NO_AUTH: ${STREAMOPS_LOCAL_NO_AUTH:-false}
      PORT: ${PORT:-3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:3000}
      OVERLAY_BASE_URL: ${OVERLAY_BASE_URL:-http://localhost:3000/overlay}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_INSECURE_DEV: ${ALLOW_INSECURE_DEV:-false}
      ALLOW_LEGACY_WS_QUERY_AUTH: ${ALLOW_LEGACY_WS_QUERY_AUTH:-false}
      TWITCH_ENABLE_EVENTSUB: ${TWITCH_ENABLE_EVENTSUB:-false}
      TWITCH_EVENTSUB_SUBSCRIPTIONS: ${TWITCH_EVENTSUB_SUBSCRIPTIONS:-stream.online stream.offline channel.chat.message channel.channel_points_custom_reward_redemption.add}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_REDIRECT_URI: ${TWITCH_REDIRECT_URI:-http://localhost:3000/api/twitch/auth/callback}
      TWITCH_PUBLIC_REDIRECT_URI: ${TWITCH_PUBLIC_REDIRECT_URI:-http://localhost:3000/api/public/twitch/auth/callback}
      TWITCH_EXTRA_SCOPES: ${TWITCH_EXTRA_SCOPES:-}
      TWITCH_TOKEN_STORE_PATH: ${TWITCH_TOKEN_STORE_PATH:-/app/.streamops/twitch-token.json}
      TWITCH_TOKEN_ENCRYPTION_KEY: ${TWITCH_TOKEN_ENCRYPTION_KEY:-}
      TWITCH_TOKEN_ENCRYPTION_KEY_FILE: ${TWITCH_TOKEN_ENCRYPTION_KEY_FILE:-}
      TWITCH_USER_ACCESS_TOKEN: ${TWITCH_USER_ACCESS_TOKEN:-}
      TWITCH_BROADCASTER_ID: ${TWITCH_BROADCASTER_ID:-}
      TWITCH_BOT_USER_ID: ${TWITCH_BOT_USER_ID:-}
      TWITCH_CHAT_SENDER_ID: ${TWITCH_CHAT_SENDER_ID:-}
      TWITCH_CHAT_MODE: ${TWITCH_CHAT_MODE:-broadcaster}
      TWITCH_CHAT_THROTTLE_MS: ${TWITCH_CHAT_THROTTLE_MS:-1500}
      TWITCH_CHAT_COOLDOWN_MS: ${TWITCH_CHAT_COOLDOWN_MS:-10000}
      TWITCH_CHAT_MAX_QUEUE: ${TWITCH_CHAT_MAX_QUEUE:-20}
      TWITCH_CHAT_MAX_LENGTH: ${TWITCH_CHAT_MAX_LENGTH:-500}
      TWITCH_CHAT_TEMPLATE_VALUE_MAX_LENGTH: ${TWITCH_CHAT_TEMPLATE_VALUE_MAX_LENGTH:-120}
      TWITCH_API_TIMEOUT_MS: ${TWITCH_API_TIMEOUT_MS:-10000}
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET:-}
      BRIDGE_SHARED_SECRET_FILE: ${BRIDGE_SHARED_SECRET_FILE:-}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
      DATABASE_MIGRATION_MODE: ${DATABASE_MIGRATION_MODE:-check}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DISCORD_SAAS_ENABLED: ${DISCORD_SAAS_ENABLED:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_CLIENT_SECRET_FILE: ${DISCORD_CLIENT_SECRET_FILE:-}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-}
      DISCORD_OAUTH_TOKEN_ENCRYPTION_KEY: ${DISCORD_OAUTH_TOKEN_ENCRYPTION_KEY:-}
      DISCORD_OAUTH_TOKEN_ENCRYPTION_KEY_FILE: ${DISCORD_OAUTH_TOKEN_ENCRYPTION_KEY_FILE:-}
      DISCORD_SETUP_LINK_TTL_SECONDS: ${DISCORD_SETUP_LINK_TTL_SECONDS:-600}
      DISCORD_OAUTH_SESSION_TTL_SECONDS: ${DISCORD_OAUTH_SESSION_TTL_SECONDS:-900}
      DISCORD_API_TIMEOUT_MS: ${DISCORD_API_TIMEOUT_MS:-10000}
      DISCORD_BOT_INTERNAL_API_ENABLED: ${DISCORD_BOT_INTERNAL_API_ENABLED:-false}
      DISCORD_BOT_INTERNAL_AUTH_KEY: ${DISCORD_BOT_INTERNAL_AUTH_KEY:-}
      DISCORD_BOT_INTERNAL_AUTH_KEY_FILE: ${DISCORD_BOT_INTERNAL_AUTH_KEY_FILE:-/run/secrets/discord_bot_internal_auth_key}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_BOT_PREFIX_COMMANDS_ENABLED: ${DISCORD_BOT_PREFIX_COMMANDS_ENABLED:-false}
      DISCORD_BOT_MANAGEMENT_ENABLED: ${DISCORD_BOT_MANAGEMENT_ENABLED:-false}
      AGENT_INGESTION_ENABLED: ${AGENT_INGESTION_ENABLED:-false}
      AGENT_CREDENTIAL_TTL_DAYS: ${AGENT_CREDENTIAL_TTL_DAYS:-90}
      AGENT_CLOCK_SKEW_SECONDS: ${AGENT_CLOCK_SKEW_SECONDS:-300}
      AGENT_NONCE_TTL_SECONDS: ${AGENT_NONCE_TTL_SECONDS:-600}
      AGENT_MAXIMUM_BODY_BYTES: ${AGENT_MAXIMUM_BODY_BYTES:-16384}
      AGENT_RATE_LIMIT_PER_MINUTE: ${AGENT_RATE_LIMIT_PER_MINUTE:-120}
      DISCORD_MANAGEMENT_OAUTH_REDIRECT_URI: ${DISCORD_MANAGEMENT_OAUTH_REDIRECT_URI:-http://localhost:3000/api/discord/management/oauth/callback}
      DISCORD_MANAGEMENT_OAUTH_TTL_SECONDS: ${DISCORD_MANAGEMENT_OAUTH_TTL_SECONDS:-600}
      DISCORD_MANAGEMENT_IDLE_TTL_SECONDS: ${DISCORD_MANAGEMENT_IDLE_TTL_SECONDS:-28800}
      DISCORD_MANAGEMENT_ABSOLUTE_TTL_SECONDS: ${DISCORD_MANAGEMENT_ABSOLUTE_TTL_SECONDS:-86400}
      AGENT_BOOTSTRAP_TTL_SECONDS: ${AGENT_BOOTSTRAP_TTL_SECONDS:-600}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_ACCOUNT_REGION: ${RIOT_ACCOUNT_REGION:-asia}
      RIOT_LOL_PLATFORM: ${RIOT_LOL_PLATFORM:-kr}
      RIOT_RATE_LIMIT_ENABLED: ${RIOT_RATE_LIMIT_ENABLED:-true}
      RIOT_RATE_LIMIT_PER_SECOND: ${RIOT_RATE_LIMIT_PER_SECOND:-20}
      RIOT_RATE_LIMIT_PER_TWO_MINUTES: ${RIOT_RATE_LIMIT_PER_TWO_MINUTES:-100}
      RIOT_RATE_LIMIT_QUEUE_MAX: ${RIOT_RATE_LIMIT_QUEUE_MAX:-500}
      RIOT_API_TIMEOUT_MS: ${RIOT_API_TIMEOUT_MS:-10000}
      STREAMOPS_LOGS_DIR: /app/logs
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}
      STREAMOPS_STATE_DIR: /app/.streamops
      STREAMOPS_REPORTS_DIR: /app/reports
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DASHBOARD_AUTH_TOKEN: ${DASHBOARD_AUTH_TOKEN:-}
      DASHBOARD_AUTH_TOKEN_FILE: ${DASHBOARD_AUTH_TOKEN_FILE:-}
      DASHBOARD_SESSION_TTL_MS: ${DASHBOARD_SESSION_TTL_MS:-28800000}
      OVERLAY_ACCESS_TOKEN: ${OVERLAY_ACCESS_TOKEN:-}
      OVERLAY_ACCESS_TOKEN_FILE: ${OVERLAY_ACCESS_TOKEN_FILE:-}
      SUPPORT_MAILBOX_ENABLED: ${SUPPORT_MAILBOX_ENABLED:-false}
      SUPPORT_MAILBOX_ADDRESS: ${SUPPORT_MAILBOX_ADDRESS:-support@yoro.gg}
      SUPPORT_MAILBOX_WEBHOOK_SECRET: ${SUPPORT_MAILBOX_WEBHOOK_SECRET:-}
      SUPPORT_MAILBOX_WEBHOOK_SECRET_FILE: ${SUPPORT_MAILBOX_WEBHOOK_SECRET_FILE:-}
      SUPPORT_MAILBOX_ENCRYPTION_KEY: ${SUPPORT_MAILBOX_ENCRYPTION_KEY:-}
      SUPPORT_MAILBOX_ENCRYPTION_KEY_FILE: ${SUPPORT_MAILBOX_ENCRYPTION_KEY_FILE:-}
      SUPPORT_MAILBOX_STATE_PATH: ${SUPPORT_MAILBOX_STATE_PATH:-/app/.streamops/support-mailbox.json.enc}
      SUPPORT_MAILBOX_RETENTION_DAYS: ${SUPPORT_MAILBOX_RETENTION_DAYS:-90}
      SUPPORT_MAILBOX_MAX_MESSAGES: ${SUPPORT_MAILBOX_MAX_MESSAGES:-1000}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_CONTACT_ADDRESS: ${LEGAL_CONTACT_ADDRESS:-}
      LEGAL_PRIVACY_OFFICER_NAME: ${LEGAL_PRIVACY_OFFICER_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-support@yoro.gg}
      LEGAL_CONTACT_PHONE: ${LEGAL_CONTACT_PHONE:-}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
      LEGAL_MINIMUM_AGE: ${LEGAL_MINIMUM_AGE:-14}
      LEGAL_GOVERNING_LAW_KO: ${LEGAL_GOVERNING_LAW_KO:-}
      LEGAL_GOVERNING_LAW_JA: ${LEGAL_GOVERNING_LAW_JA:-}
      LEGAL_DISPUTE_VENUE_KO: ${LEGAL_DISPUTE_VENUE_KO:-}
      LEGAL_DISPUTE_VENUE_JA: ${LEGAL_DISPUTE_VENUE_JA:-}
      LEGAL_PROCESSORS_KO: ${LEGAL_PROCESSORS_KO:-}
      LEGAL_PROCESSORS_JA: ${LEGAL_PROCESSORS_JA:-}
      LEGAL_CROSS_BORDER_TRANSFER_KO: ${LEGAL_CROSS_BORDER_TRANSFER_KO:-}
      LEGAL_CROSS_BORDER_TRANSFER_JA: ${LEGAL_CROSS_BORDER_TRANSFER_JA:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./logs:/app/logs
      - ./apps/server/config:/app/apps/server/config:ro
      - ./reports:/app/reports
      - ./secrets:/run/secrets:ro
      - streamops_state:/app/.streamops
    networks:
      - default
      - database_internal
    healthcheck:
      test: ["CMD", "node", "-e", "const port=process.env.PORT||3000; fetch(`http://127.0.0.1:$${port}/health/ready`).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  discord-bot:
    image: ${YORO_DISCORD_BOT_IMAGE:-streamops-discord-bot:local}
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0-dev}
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    profiles:
      - discord-bot
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DISCORD_BOT_ENABLED: ${DISCORD_BOT_ENABLED:-false}
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_TEST_GUILD_ID: ${DISCORD_TEST_GUILD_ID:-}
      DISCORD_BOT_INTERNAL_AUTH_KEY_FILE: /run/secrets/discord_bot_internal_auth_key
      DISCORD_BOT_INTERNAL_BASE_URL: http://server:${PORT:-3000}
      DISCORD_BOT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DISCORD_BOT_HEALTH_PORT: 3100
      DISCORD_BOT_INTERNAL_TIMEOUT_MS: ${DISCORD_BOT_INTERNAL_TIMEOUT_MS:-5000}
      DISCORD_BOT_PREFIX_COMMANDS_ENABLED: ${DISCORD_BOT_PREFIX_COMMANDS_ENABLED:-false}
    secrets:
      - source: discord_bot_token
        target: discord_bot_token
        uid: "10002"
        gid: "10002"
        mode: 0400
      - source: discord_bot_internal_auth_key
        target: discord_bot_internal_auth_key
        uid: "10002"
        gid: "10002"
        mode: 0400
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - database_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.6-bookworm}
    restart: unless-stopped
    profiles:
      - database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamops_app}
      POSTGRES_DB: ${POSTGRES_DB:-streamops}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    shm_size: 128m
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: streamops-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  streamops_state:
  postgres_data:

networks:
  database_internal:
    internal: true

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  discord_bot_token:
    file: ${DISCORD_BOT_TOKEN_SOURCE_FILE:-./discord-bot-secrets/discord_bot_token}
  discord_bot_internal_auth_key:
    file: ${DISCORD_BOT_INTERNAL_AUTH_KEY_SOURCE_FILE:-./secrets/discord_bot_internal_auth_key}
